name: Test macOS Build & Execution

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test-mac:
    runs-on: macos-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.22'

    - name: Build macOS Binary
      run: go build -v -o bruncher-mac

    - name: Test Execution (Help Flag)
      run: |
        chmod +x bruncher-mac
        ./bruncher-mac --help || true

    - name: Verify Binary Format
      run: file bruncher-mac
