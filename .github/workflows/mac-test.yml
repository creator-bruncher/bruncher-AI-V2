name: Test macOS Build & Execution

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test-mac:
    runs-on: macos-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.22'

    - name: Build macOS Binary
      run: go build -v -o bruncher-mac

    - name: SSH Access for Live TUI Testing
      uses: mxschmitt/action-tmate@v3